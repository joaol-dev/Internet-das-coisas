services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: irrigacao
      POSTGRES_PASSWORD: irrigacao_local
      POSTGRES_DB: irrigacao
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leituras:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrigacao"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  leituras:
